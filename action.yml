name: Repo Guardian GitHub automation
description: Manage your GitHub repository topics, forks, private copies, and visibility with explicit JSON requests
author: Repo Guardian contributors
branding:
  icon: git-branch
  color: blue

inputs:
  token:
    description: GitHub token with required repository administration permissions
    required: true
  owner:
    description: GitHub account owning the target repositories; defaults to the calling repository owner
    required: false
  request:
    description: Strict Repo Guardian JSON object to execute
    required: true

runs:
  using: composite
  steps:
    - name: Execute Repo Guardian request
      shell: bash
      env:
        RG_ADMIN_TOKEN: ${{ inputs.token }}
        RG_OWNER: ${{ inputs.owner || github.repository_owner }}
        RG_REQUEST: ${{ inputs.request }}
        PYTHONPATH: ${{ github.action_path }}/src
      run: |
        set -euo pipefail
        python3 -m repoguardian.cli execute-json
